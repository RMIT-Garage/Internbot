version: 2
updates:
  - package-ecosystem: npm
    # pnpm workspace: keep one npm update block at the repository root so
    # Dependabot updates package manifests together with the shared pnpm-lock.yaml.
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
