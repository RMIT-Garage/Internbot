name: Terraform Plan

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "infrastructure/**"
      - ".github/workflows/_terraform.yml"
      - ".github/workflows/terraform-plan.yml"

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

# PR plans impersonate the read-only github-planner SA so they work from any
# ref (including refs/pull/N/merge). Apply workflows use the write
# github-deploy SA restricted to refs/heads/{develop,main}.
jobs:
  plan-dev:
    if: github.base_ref == 'develop'
    uses: ./.github/workflows/_terraform.yml
    with:
      action: plan
      env: dev
      state_bucket: internbot-dev-f1abe-tf-state
      wif_provider: projects/421196143498/locations/global/workloadIdentityPools/github/providers/github-provider
      terraform_sa: github-planner@internbot-dev-f1abe.iam.gserviceaccount.com

  plan-prod:
    if: github.base_ref == 'main'
    uses: ./.github/workflows/_terraform.yml
    with:
      action: plan
      env: prod
      state_bucket: internbot-65e94-tf-state
      wif_provider: projects/1022879312196/locations/global/workloadIdentityPools/github/providers/github-provider
      terraform_sa: github-planner@internbot-65e94.iam.gserviceaccount.com
