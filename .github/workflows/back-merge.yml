name: Back-merge main → develop

# Runs on every push to `main` (i.e. every release-style merge from develop or
# every hotfix landing on main). Fast-forwards `develop` if possible, otherwise
# creates a merge commit and pushes it. If the merge would conflict, opens a
# PR for human resolution rather than failing silently.
#
# Why: GitFlow's documented rule is "back-merge main → develop after every
# release" so develop's ancestry stays current with main's. When this is left
# manual, it gets forgotten and develop drifts — past 32 commits we hit 62
# add/add conflicts during a develop → main merge. This workflow makes the
# back-merge mechanical.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: back-merge-main-to-develop
  cancel-in-progress: false

jobs:
  back-merge:
    name: Back-merge main into develop
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: develop
          fetch-depth: 0
          # Default GITHUB_TOKEN can push to develop because branch protection
          # exempts the github-actions[bot] for this workflow when merging from
          # main. If protection ever blocks, switch to a fine-grained PAT in
          # secrets.BACK_MERGE_PAT (with `contents: write` on this repo only).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Attempt fast-forward or merge commit
        id: merge
        run: |
          set -e
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "result=already-current" >> "$GITHUB_OUTPUT"
            echo "develop already contains main; nothing to back-merge."
            exit 0
          fi

          # Try a clean merge first.
          if git merge origin/main --no-ff -m "chore(merge): back-merge main → develop after release"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push back-merged develop
        if: steps.merge.outputs.result == 'merged'
        run: git push origin develop

      - name: Open PR for manual conflict resolution
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/github-script@v8
        with:
          script: |
            const branch = `back-merge/main-to-develop-${context.sha.slice(0, 7)}`;
            // Create a branch at main's tip so a human can resolve the conflict in a PR.
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha: context.sha,
            });
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'develop',
              head: branch,
              title: 'chore(merge): back-merge main → develop (manual resolution required)',
              body: [
                'Automated back-merge failed because of conflicts between `main` and `develop`.',
                '',
                'Resolve conflicts locally taking the change you intend to keep, push, and merge with',
                'a merge commit (`--no-ff`) so develop\'s ancestry includes this main commit.',
                '',
                `Source: \`main\` at ${context.sha}.`,
              ].join('\n'),
            });

      - name: Summary
        run: |
          echo "Back-merge result: ${{ steps.merge.outputs.result }}"
