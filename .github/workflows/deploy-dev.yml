name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Deploy Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed deploy surfaces
        id: detect
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          head="${{ github.sha }}"

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$head" | tee changed-files.txt

          backend=false
          frontend=false

          if grep -Eq '^(backend/|firebase\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/)' changed-files.txt; then
            backend=true
          fi

          if grep -Eq '^(frontend/|firebase\.json$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/)' changed-files.txt; then
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/_ci.yml

  terraform:
    needs: ci
    uses: ./.github/workflows/_terraform.yml
    with:
      action: apply
      env: dev
      state_bucket: internbot-dev-ae3a3-tf-state
      wif_provider: projects/990371971523/locations/global/workloadIdentityPools/github/providers/github-provider
      terraform_sa: terraform-ci@internbot-dev-ae3a3.iam.gserviceaccount.com

  deploy-backend:
    needs: [changes, ci, terraform]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/_deploy.yml
    with:
      firebase_project_id: internbot-dev-ae3a3
      wif_provider: projects/990371971523/locations/global/workloadIdentityPools/github/providers/github-provider
      deploy_service_account: github-deploy@internbot-dev-ae3a3.iam.gserviceaccount.com
      # Only functions via firebase CLI. Firestore/Storage rules + indexes
      # are managed by Terraform (google_firebaserules_* + google_firestore_*)
      # for drift detection and atomic infra deploys.
      deploy_targets: functions
      # Non-secret RAG service URL — written into the function's runtime env
      # at deploy. The RAG API key is a separate secret (functions:secrets:set).
      rag_service_url: https://australia-southeast1-internbotrag.cloudfunctions.net/api

  deploy-frontend:
    needs: [changes, ci, terraform]
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/_deploy-hosting.yml
    with:
      firebase_project_id: internbot-dev-ae3a3
      wif_provider: projects/990371971523/locations/global/workloadIdentityPools/github/providers/github-provider
      deploy_service_account: github-deploy@internbot-dev-ae3a3.iam.gserviceaccount.com
      # Firebase web SDK config (NEXT_PUBLIC_FIREBASE_* + apiUrl/appUrl) is
      # fetched from Secret Manager (`firebase-web-config`) at build time.
      # Terraform owns the secret — see infrastructure/modules/web-app/.
