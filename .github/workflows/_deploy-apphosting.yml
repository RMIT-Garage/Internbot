name: Deploy App Hosting (reusable)

on:
  workflow_call:
    inputs:
      firebase_project_id:
        description: Target Firebase project ID
        required: true
        type: string
      wif_provider:
        description: Full resource name of the Workload Identity Provider
        required: true
        type: string
      deploy_service_account:
        description: Email of the deploy service account to impersonate
        required: true
        type: string
      apphosting_backend_id:
        description: Firebase App Hosting backend ID to roll out
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Roll out App Hosting (${{ inputs.firebase_project_id }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.deploy_service_account }}

      - name: Roll out App Hosting frontend
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if ! npx --yes firebase-tools@15 apphosting:backends:get \
            ${{ inputs.apphosting_backend_id }} \
            --project ${{ inputs.firebase_project_id }} \
            --non-interactive >/dev/null; then
            {
              echo "::error::Firebase App Hosting backend '${{ inputs.apphosting_backend_id }}' does not exist in project '${{ inputs.firebase_project_id }}'."
              echo "::error::In Firebase App Hosting terminology, this backend is the frontend hosting service, not the Cloud Functions API."
              echo "::error::Create/import the App Hosting backend first, then rerun this workflow."
            }
            exit 1
          fi

          npx --yes firebase-tools@15 apphosting:rollouts:create \
            ${{ inputs.apphosting_backend_id }} \
            --git-commit ${{ github.sha }} \
            --project ${{ inputs.firebase_project_id }} \
            --force \
            --non-interactive
