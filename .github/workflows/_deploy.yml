name: Deploy Firebase Functions (reusable)

on:
  workflow_call:
    inputs:
      firebase_project_id:
        description: Target Firebase project ID
        required: true
        type: string
      wif_provider:
        description: Full resource name of the Workload Identity Provider
        required: true
        type: string
      deploy_service_account:
        description: Email of the deploy service account to impersonate
        required: true
        type: string
      deploy_targets:
        description: Firebase deploy --only targets (e.g. "functions,firestore,storage")
        required: false
        type: string
        default: functions
      rag_service_url:
        description: Base URL of the RAG service the api function proxies to (non-secret config)
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Functions (${{ inputs.firebase_project_id }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend build

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.deploy_service_account }}

      # Identity Platform password policy lives outside Terraform
      # (`google_identity_platform_config` does not surface
      # `password_policy_config`). Re-asserting on every deploy keeps the
      # policy declarative-by-execution; the script is idempotent and uses
      # the ADC file written by the auth step above.
      - name: Apply Identity Platform password policy
        env:
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: pnpm --filter backend run auth:configure-password-policy

      # Firebase Functions v2 reads runtime env vars from dotenv files in the
      # functions source dir (backend/) at deploy time; `.env.<projectId>` is
      # loaded only for that project. RAG_SERVICE_URL is non-secret config — the
      # RAG endpoint requires a separate `ibk_*` key set via
      # `firebase functions:secrets:set RAG_API_KEY`. All .env* files are
      # gitignored, so CI writes this fresh each run.
      - name: Write runtime function env
        if: inputs.rag_service_url != ''
        run: |
          echo "RAG_SERVICE_URL=${{ inputs.rag_service_url }}" >> "backend/.env.${{ inputs.firebase_project_id }}"

      - name: Deploy to Firebase
        # Pinned firebase-tools major version for deterministic CI runs.
        # Uses root firebase.json (functions-only config). The emulator has its
        # own config under docker/firebase-emulator/firebase.json.
        # Public-invoker IAM is declared in backend/src/index.ts via
        # `invoker: 'public'` — Firebase deploy sets it automatically.
        # FIREBASE_PROJECT_ID is consumed by `resolveStorageBucket()` in
        # backend/src/infrastructure/config/storage-bucket.ts when the
        # firebase CLI parses function configs to discover the bucket for
        # the `syncAttachmentMetadata` storage trigger.
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        # `--force` bypasses the "function has a retry/failure policy"
        # confirmation prompt. `syncAttachmentMetadata` sets `retry: true`
        # on its `onObjectFinalized` trigger so transient Firestore /
        # Storage failures are redelivered by Eventarc; that policy is
        # intentional but Firebase CLI requires explicit acknowledgement.
        run: |
          npx --yes firebase-tools@15 deploy \
            --only ${{ inputs.deploy_targets }} \
            --project ${{ inputs.firebase_project_id }} \
            --non-interactive \
            --force
