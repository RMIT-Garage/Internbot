name: Deploy Firebase Hosting (reusable)

on:
  workflow_call:
    inputs:
      firebase_project_id:
        description: Target Firebase project ID
        required: true
        type: string
      wif_provider:
        description: Full resource name of the Workload Identity Provider
        required: true
        type: string
      deploy_service_account:
        description: Email of the deploy service account to impersonate
        required: true
        type: string
      public_firebase_api_key:
        description: NEXT_PUBLIC_FIREBASE_API_KEY (not a secret — scoped by Firebase rules + auth domain)
        required: true
        type: string
      public_firebase_auth_domain:
        description: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        required: true
        type: string
      public_firebase_project_id:
        description: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        required: true
        type: string
      public_firebase_storage_bucket:
        description: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        required: true
        type: string
      public_firebase_messaging_sender_id:
        description: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        required: true
        type: string
      public_firebase_app_id:
        description: NEXT_PUBLIC_FIREBASE_APP_ID
        required: true
        type: string
      public_api_url:
        description: NEXT_PUBLIC_API_URL — backend Cloud Functions URL
        required: true
        type: string
      public_app_name:
        description: NEXT_PUBLIC_APP_NAME
        required: false
        type: string
        default: Internbot
      public_app_url:
        description: NEXT_PUBLIC_APP_URL — canonical hosting URL
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Hosting (${{ inputs.firebase_project_id }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}', 'frontend/**/*.{json,mjs,ts}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (static export)
        # NEXT_PUBLIC_* values get baked into the static bundle at build time.
        # Firebase client API keys are NOT secrets — scoped by Firebase Security
        # Rules and authDomain allowlist — so they live in the workflow file.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ inputs.public_firebase_api_key }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ inputs.public_firebase_auth_domain }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ inputs.public_firebase_project_id }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ inputs.public_firebase_storage_bucket }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ inputs.public_firebase_messaging_sender_id }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ inputs.public_firebase_app_id }}
          NEXT_PUBLIC_API_URL: ${{ inputs.public_api_url }}
          NEXT_PUBLIC_APP_NAME: ${{ inputs.public_app_name }}
          NEXT_PUBLIC_APP_URL: ${{ inputs.public_app_url }}
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'false'
        run: pnpm --filter frontend build

      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.deploy_service_account }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project ${{ inputs.firebase_project_id }} \
            --non-interactive
