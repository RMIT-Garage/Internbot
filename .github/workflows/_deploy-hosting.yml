name: Deploy Firebase Hosting (reusable)

on:
  workflow_call:
    inputs:
      firebase_project_id:
        description: Target Firebase project ID
        required: true
        type: string
      wif_provider:
        description: Full resource name of the Workload Identity Provider
        required: true
        type: string
      deploy_service_account:
        description: Email of the deploy service account to impersonate
        required: true
        type: string
      public_app_name:
        description: NEXT_PUBLIC_APP_NAME — display name; not env-specific so it stays inline
        required: false
        type: string
        default: Internbot

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Hosting (${{ inputs.firebase_project_id }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}', 'frontend/**/*.{json,mjs,ts}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Authenticate first — the build step depends on values fetched from
      # Secret Manager, so we need creds before we can build.
      - name: Authenticate to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.deploy_service_account }}

      - uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f27b62f8e06 # v2

      # Pull the Firebase Web SDK config from Secret Manager. The secret
      # name is the same in every project (`firebase-web-config`) — only
      # the project ID varies. Terraform writes it; CI consumes it.
      # We unpack the JSON once and pipe each NEXT_PUBLIC_* into $GITHUB_ENV
      # so the next build step can read them as plain env vars.
      - name: Fetch Firebase web config from Secret Manager
        run: |
          set -euo pipefail
          config_json=$(gcloud secrets versions access latest \
            --secret=firebase-web-config \
            --project=${{ inputs.firebase_project_id }})

          # Validate up-front so a malformed secret fails the job here, not
          # halfway through the build with a confusing Next.js error.
          # `all(...)` is used over comma-form because `jq -e .a, .b` only
          # reflects the exit status of the last value — a missing apiKey
          # with a present appUrl would silently pass.
          echo "$config_json" | jq -e '
            [.apiKey, .authDomain, .projectId, .storageBucket, .messagingSenderId, .appId, .apiUrl, .appUrl]
            | all(type == "string" and length > 0)
          ' >/dev/null

          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=$(echo "$config_json" | jq -r '.apiKey')"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$(echo "$config_json" | jq -r '.authDomain')"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$(echo "$config_json" | jq -r '.projectId')"
            echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$(echo "$config_json" | jq -r '.storageBucket')"
            echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$(echo "$config_json" | jq -r '.messagingSenderId')"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=$(echo "$config_json" | jq -r '.appId')"
            echo "NEXT_PUBLIC_API_URL=$(echo "$config_json" | jq -r '.apiUrl')"
            echo "NEXT_PUBLIC_APP_URL=$(echo "$config_json" | jq -r '.appUrl')"
          } >> "$GITHUB_ENV"

      - name: Build frontend (static export)
        # NEXT_PUBLIC_* values get baked into the static bundle at build time.
        # All env-specific values come from $GITHUB_ENV (set in the previous
        # step from Secret Manager); only the constant non-secret defaults
        # are inlined here.
        env:
          NEXT_PUBLIC_APP_NAME: ${{ inputs.public_app_name }}
          NEXT_PUBLIC_USE_FIREBASE_EMULATOR: 'false'
        run: pnpm --filter frontend build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          npx --yes firebase-tools@15 deploy \
            --only hosting \
            --project ${{ inputs.firebase_project_id }} \
            --non-interactive
