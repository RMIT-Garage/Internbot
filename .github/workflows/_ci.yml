name: CI (reusable)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate placeholders
        run: pnpm run validate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: OpenAPI spec-freeze check
        # Regenerates backend/openapi.json from the current Zod schemas and
        # fails if it differs from the committed snapshot. Forces every
        # contract change to be a deliberate, reviewable diff.
        run: pnpm --filter backend run openapi:check

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend run build

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Cache .next/cache (webpack/SWC module graph). Still beneficial even
      # though the frontend ships as a static export — Next builds it via the
      # same toolchain. Key includes source files so code changes bust it;
      # restore-keys widen to lockfile-only for partial reuse.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}', 'frontend/**/*.{json,mjs,ts}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (static export)
        run: pnpm --filter frontend run build

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter frontend run test

  test-backend:
    name: Backend Tests (all tiers + coverage ≥80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pre-build the Firebase emulator Docker image with GHA layer cache, then
      # docker-compose will use this already-built image (same tag compose
      # produces by default: <project>-<service>:latest). Saves ~30-60s on
      # cache hit by skipping the apt-get + firebase-tools install layers.
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Firebase emulator image (cached)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: docker/firebase-emulator/Dockerfile
          tags: internbot-firebase-emulators:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Firebase emulators
        # `docker compose up -d --wait` (via pnpm run emulator) blocks until
        # the healthcheck defined in docker-compose.yml reports healthy. Image
        # is already built above, so compose skips the build step.
        run: pnpm run emulator

      - name: Run all backend tests with coverage
        # `test:coverage` runs all three vitest projects (unit + integration +
        # component). Coverage thresholds (≥80% for lines/statements/functions/
        # branches) are configured in backend/vitest.config.ts and vitest fails
        # the run if any metric drops below.
        run: pnpm --filter backend run test:coverage

      - name: Stop Firebase emulators
        if: always()
        run: pnpm run emulator:down || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
