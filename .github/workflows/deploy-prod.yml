name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml

  terraform:
    needs: ci
    uses: ./.github/workflows/_terraform.yml
    with:
      action: apply
      env: prod
      state_bucket: internbot-prod-tf-state
      wif_provider: projects/947410245672/locations/global/workloadIdentityPools/github/providers/github-provider
      terraform_sa: terraform-ci@internbot-prod.iam.gserviceaccount.com

  deploy:
    needs: [ci, terraform]
    uses: ./.github/workflows/_deploy.yml
    with:
      firebase_project_id: internbot-prod
      wif_provider: projects/947410245672/locations/global/workloadIdentityPools/github/providers/github-provider
      deploy_service_account: github-deploy@internbot-prod.iam.gserviceaccount.com
      # Only functions via firebase CLI. Firestore/Storage rules + indexes
      # are managed by Terraform (google_firebaserules_* + google_firestore_*)
      # for drift detection and atomic infra deploys.
      deploy_targets: functions
