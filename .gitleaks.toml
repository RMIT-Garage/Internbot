title = "internbot gitleaks config"

[allowlist]
  description = "Allow example/placeholder values in template files"
  regexes = [
    '''EXAMPLE_''',
    '''your-.*-here''',
    '''\{\{.*\}\}''',
    '''placeholder''',
    '''changeme''',
  ]
  paths = [
    '''\.env\.example$''',
    '''\.env\.local\.example$''',
    '''docs/''',
    '''README\.md$''',
    '''CLAUDE\.md$''',
  ]
